apiVersion: apps/v1
kind: Deployment

metadata:
  name: company-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: company-backend

  template:
    metadata:
      labels:
        app: company-backend

    spec:
      containers:
        - name: backend
          image: rladmswlr/ex8-company-backend:f740768
          ports:
            - containerPort: 8000
